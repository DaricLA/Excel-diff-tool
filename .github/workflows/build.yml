name: 打包EXE

on: workflow_dispatch  # 只在手动点击时运行

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        pip install -r requirements.txt pyinstaller
        pyinstaller --onefile --windowed --name "ExcelDiffTool" src/main.py
    - uses: actions/upload-artifact@v3
      with:
        name: ExcelDiffTool
        path: dist/ExcelDiffTool.exe
